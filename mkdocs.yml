site_name: cuhc
site_description: Exact hierarchical clustering and HDBSCAN on the GPU, with the scikit-learn and scipy APIs
docs_dir: docs
exclude_docs: requirements.txt
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

nav:
  - Home: index.md
  - Tutorial: tutorial_customer_segments.md
  - API reference: api.md
  - Design:
      - Architecture: architecture.md
      - The distance kernel: distance_matrix.md
      - Dense linkage: dense_linkage.md
      - Single linkage (Borůvka MST): boruvka_mst.md
      - Ward linkage (RNN rounds): rnn_ward.md
      - Ward linkage (nearest-neighbour chain): nn_chain.md
      - HDBSCAN: hdbscan.md
      - Symmetry and spatial pruning: all_pairs_passes.md

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          # Read the docstrings from the source files. The package is not imported,
          # so the docs build needs no GPU, no CUDA and no compiled library.
          paths: [python]
          options:
            allow_inspection: false
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members: false
            separate_signature: true
            show_signature_annotations: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Keep letters such as "ů" in heading anchors, as GitHub does, so that the
      # same links operate in the README on GitHub and on this site.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
